[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellybrain"
version = "0.1.0"
description = "Glass-brain jelly-style 3D subregion visualization from anatomical atlases"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "brain-viz-survey" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pyvista",
    "nibabel",
    "nilearn",
    "scipy",
    "scikit-image",
    "pillow",
]

[project.optional-dependencies]
jupyter = ["pyvista[jupyter]", "trame", "trame-vtk", "trame-server"]

[project.scripts]
jellybrain = "jellybrain.cli:main"

[tool.setuptools.packages.find]
include = ["jellybrain*"]

[tool.setuptools.package-data]
jellybrain = ["data/*.json"]
